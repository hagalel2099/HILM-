name: Build & Release APK — HILM Launcher

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar como GitHub Release para o atualizador do Núcleo HILM"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Tag da release (ex.: v1.0.2). Se vazio, usa v + versionName do build.gradle.kts"
        required: false
        default: ""
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: locate
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android-project/app/build.gradle.kts" ]; then
            echo "project_dir=android-project" >> "$GITHUB_OUTPUT"
          else
            echo "Projeto Android não encontrado."
            exit 1
          fi

      - name: Read app version from Gradle
        id: appver
        run: |
          GRADLE_FILE="${{ steps.locate.outputs.project_dir }}/app/build.gradle.kts"
          VER_NAME=$(grep -m1 'versionName' "$GRADLE_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version_name=${VER_NAME:-1.0.1}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build APK (Signed Release if secrets set, else Debug)
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          NOSSO_UNIVERSO_UPDATE_URL: ${{ vars.NOSSO_UNIVERSO_UPDATE_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist-apk
          EXTRA_ARGS=""
          if [ -n "${NOSSO_UNIVERSO_UPDATE_URL}" ]; then
            EXTRA_ARGS="-PNOSSO_UNIVERSO_UPDATE_URL=${NOSSO_UNIVERSO_UPDATE_URL}"
          fi

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${RELEASE_STORE_PASSWORD}" ] && [ -n "${RELEASE_KEY_ALIAS}" ] && [ -n "${RELEASE_KEY_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > app/release.jks
            export RELEASE_STORE_FILE="$(pwd)/app/release.jks"
            gradle assembleRelease --no-daemon ${EXTRA_ARGS}
            rm -f app/release.jks
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            gradle assembleDebug --no-daemon ${EXTRA_ARGS}
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          cp "$APK_SRC" "dist-apk/HILM-Launcher-v${{ steps.appver.outputs.version_name }}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HILM-Launcher-APK
          path: ${{ steps.locate.outputs.project_dir }}/dist-apk/*.apk

      - name: Determine Release Tag
        id: reltag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.appver.outputs.version_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Release
        if: steps.reltag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: "HILM Launcher ${{ steps.reltag.outputs.tag }}"
          files: ${{ steps.locate.outputs.project_dir }}/dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
